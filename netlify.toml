# Netlify configuration
# ======================

[build]
  # 1. `tinacms build` generates the Tina admin UI into /admin and the
  #    generated client with cloud credentials (soft-fails via ';': on a
  #    missing Tina token/credentials the rest still runs, the sidebar
  #    just isn't available online; the site always deploys).
  # 2. Astro builds the Expand the Box page into dist/client/ and writes
  #    its Netlify server function to .netlify/v1/functions/ssr/ (the
  #    island endpoint). build/deploy-astro.mjs then moves the page +
  #    editing bridge into place. A hard failure here skips that step
  #    (the last good page stays published) but does not block the deploy.
  # 3. generate.mjs pre-renders the published Sheet CSVs into index.html
  #    and articles.html, so search engines see real text instead of
  #    "Loading…". Uses only the Node standard library, and always exits
  #    0 — a flaky Sheet must never fail a deploy (it keeps the previous
  #    markup instead).
  command = "npx -y tinacms build; npx astro build && node build/deploy-astro.mjs; node build/generate.mjs"

  # The site is plain static HTML served from the repo root, so the repo root
  # is the publish directory.
  publish = "."

  functions = "netlify/functions"

# Netlify redirects / proxy rules
# ================================
# 
# /api/possibilitators.csv is proxied to the published Google Sheet CSV.
# This avoids CORS issues — the browser sees a same-origin request.
#
# /cors-proxy/* is a generic CORS proxy for any URL (e.g. RSS feeds).
# The browser requests /cors-proxy/{encodedURL} and Netlify fetches it.
#
# To change the Google Sheet data source, update the 'to' URL below.
# The Google Sheet to edit: https://docs.google.com/spreadsheets/d/1KNXcr4MWsAP7KWf2e0aJ6G9VPWpI-4py9JilHhVdyz4/edit?usp=sharing

[[redirects]]
  from = "/api/possibilitators.csv"
  to = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTW3w2MORiW0KEFA-kLNqUNALN9VoBHGFZOg6O1Ss89TmqTtNF6xsLjweTEjrn1ejN9EPXiP4HPhvAX/pub?gid=0&single=true&output=csv"
  status = 200
  force = true

[[redirects]]
  from = "/api/pm-events.csv"
  to = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSU4q-qJs3v_sIzd3uQDjhwigwgd4fJmdJTAM1QsP2z-0td3DnYqD2XYzk6p-Dw2wgXtTYawllOV-Nu/pub?gid=477270608&single=true&output=csv"
  status = 200
  force = true

[[redirects]]
  from = "/api/village-events.csv"
  to = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSU4q-qJs3v_sIzd3uQDjhwigwgd4fJmdJTAM1QsP2z-0td3DnYqD2XYzk6p-Dw2wgXtTYawllOV-Nu/pub?gid=1323395816&single=true&output=csv"
  status = 200
  force = true

# Legacy URL redirects (301 permanent)
# ==================================
# Two pages were moved to clean, keyword-bearing directory URLs:
#   purchase-books.html -> /books/
#   noticeboard.html    -> /noticeboard/
# The old .html paths and their extensionless variants are permanently
# redirected so existing inbound links and bookmarks keep working.

[[redirects]]
  from = "/purchase-books.html"
  to = "/books/"
  status = 301
  force = true

[[redirects]]
  from = "/purchase-books"
  to = "/books/"
  status = 301
  force = true

[[redirects]]
  from = "/noticeboard.html"
  to = "/noticeboard/"
  status = 301
  force = true

# Tina visual editing island endpoint
# ===================================
# The bridge inside the published /expand-the-box/ page POSTs here to prime
# the editor's form payloads and to re-render the editable region after
# every save. The Astro build (@astrojs/netlify adapter) writes its
# self-contained server function to .netlify/v1/functions/ssr/ and Netlify
# deploys it in addition to the legacy netlify/functions/ dir. Only this
# path is routed to it — every other URL stays served by static files.
[[redirects]]
  from = "/tina-island/*"
  to = "/.netlify/functions/ssr"
  status = 200
  force = true

# NOTE: there is deliberately NO explicit redirect for the extensionless
# "/noticeboard". Netlify's default Pretty URLs behaviour already sends
# /noticeboard to /noticeboard/. An explicit force rule for "/noticeboard"
# also matches "/noticeboard/" (redirect matching is trailing-slash lenient),
# so it redirects the page to itself in an endless 301 loop — which broke the
# page in Firefox with "The page isn't redirecting properly". Do not re-add it.
